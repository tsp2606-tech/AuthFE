<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Register - AuthAPI</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>

            text-transform: none;

            white-space: nowrap;
            word-wrap: normal;
            direction: ltr;
            -webkit-font-feature-settings: 'liga';
            -webkit-font-smoothing: antialiased;
        }
    </style>

            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-container-high": "#e6e8ea",

                        "primary": "#0058be",
                        "on-error-container": "#93000a",
                        "secondary-fixed-dim": "#b7c8e1",

                        "inverse-surface": "#2d3133",
                        "secondary-fixed": "#d3e4fe",
                        "on-secondary-container": "#54647a",
                        "on-primary": "#ffffff",
                        "on-surface-variant": "#424754",
                        "background": "#f7f9fb",
                        "tertiary-fixed-dim": "#89ceff",
                        "on-primary-fixed": "#001a42",
                        "surface-container-low": "#f2f4f6",
                        "tertiary-container": "#007cb1",
                        "error-container": "#ffdad6",
                        "surface-dim": "#d8dadc",
                        "on-background": "#191c1e",

                        "on-secondary-fixed": "#0b1c30",

                    "borderRadius": {
                        "DEFAULT": "0.25rem",

                    },
                    "spacing": {
                        "lg": "24px",
                        "xl": "32px",
                        "md": "16px",
                        "sm": "8px",
                        "xs": "4px",
                        "margin-desktop": "32px",
                        "2xl": "48px",
                        "base": "4px",
                        "margin-mobile": "16px",
                        "gutter": "24px"

                    "fontFamily": {
                        "headline-lg": ["Inter"],
                        "code-md": ["JetBrains Mono"],

                        "title-lg": ["22px", { "lineHeight": "28px", "fontWeight": "500" }],

<body class="bg-surface min-h-screen flex items-center justify-center p-margin-mobile md:p-margin-desktop font-body-md text-on-surface">
<!-- Registration Canvas -->
<main class="w-full max-w-[440px]">
<!-- Branding Header -->
<div class="flex flex-col items-center mb-xl text-center">
<div class="w-16 h-16 mb-md rounded-xl overflow-hidden bg-surface-container-lowest shadow-sm flex items-center justify-center">
<img alt="AuthAPI Logo" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCR6nQxv2eijZsvdOZUCybtu_-KPwvrIbA3akzuPA3k5plievMIN_VbpseNnJkVna_NFfJM6t66fp3zfUe70KRs6pejkePdD0_clyTE8p9FA2x6b9KuSFdsxDuKK51ASLzyVcHvMb_1eF2uU3_ikiv4RVaknHTPiDKajiDTOBCARoStXxBGERVRTSZTTk7SVL57naXYfJgX3qFPjidtxQtRZptFPvt_9McNmExbmkvOlhyNiURUxU8Q"/>
</div>
<h1 class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-on-surface tracking-tight">Create an account</h1>
<p class="font-body-md text-body-md text-on-surface-variant mt-sm">Start building with AuthAPI today.</p>
</div>
<!-- Registration Card -->
<div class="bg-surface-container-lowest rounded-xl shadow-sm border border-outline-variant/30 p-lg md:p-xl">
<form action="#" class="flex flex-col gap-lg" method="POST">
<!-- Full Name Field -->
<div class="flex flex-col gap-xs">
<label class="font-label-lg text-label-lg text-on-surface font-medium" for="fullName">Full Name</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-md flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline text-[20px]" data-icon="person">person</span>
</div>
<input class="block w-full pl-[44px] pr-md py-[10px] rounded-lg border border-outline-variant bg-surface-container-lowest text-on-surface font-body-md text-body-md focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none transition-colors" id="fullName" name="fullName" placeholder="Jane Doe" required="" type="text"/>
</div>
</div>
<!-- Email Field -->
<div class="flex flex-col gap-xs">
<label class="font-label-lg text-label-lg text-on-surface font-medium" for="email">Work Email</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-md flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline text-[20px]" data-icon="mail">mail</span>
</div>
<input class="block w-full pl-[44px] pr-md py-[10px] rounded-lg border border-outline-variant bg-surface-container-lowest text-on-surface font-body-md text-body-md focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none transition-colors" id="email" name="email" placeholder="jane@company.com" required="" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-xs">
<label class="font-label-lg text-label-lg text-on-surface font-medium" for="password">Password</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-md flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline text-[20px]" data-icon="lock">lock</span>
</div>
<input class="block w-full pl-[44px] pr-md py-[10px] rounded-lg border border-outline-variant bg-surface-container-lowest text-on-surface font-body-md text-body-md focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none transition-colors" id="password" minlength="6" name="password" placeholder="••••••••" required="" type="password"/>
</div>
<p class="font-label-sm text-label-sm text-on-surface-variant flex items-center gap-xs mt-1">
<span class="material-symbols-outlined text-[14px]" data-icon="info">info</span>
                        Minimum 6 characters
                    </p>
</div>
<!-- Terms and Conditions -->
<div class="flex items-start gap-sm mt-xs">
<div class="flex items-center h-5">
<input class="w-4 h-4 rounded border-outline-variant text-primary focus:ring-primary focus:ring-offset-surface-container-lowest bg-surface-container-lowest" id="terms" name="terms" required="" type="checkbox"/>
</div>
<div class="text-sm">
<label class="font-body-md text-body-md text-on-surface-variant" for="terms">
                            I agree to the <a class="text-primary hover:text-primary-container font-medium transition-colors" href="#">Terms of Service</a> and <a class="text-primary hover:text-primary-container font-medium transition-colors" href="#">Privacy Policy</a>.
                        </label>
</div>
</div>
<!-- Submit Button -->
<button class="w-full flex justify-center items-center py-[10px] px-md border border-transparent rounded-lg shadow-sm font-label-lg text-label-lg font-medium text-on-primary bg-primary hover:bg-primary-container focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary focus:ring-offset-surface-container-lowest transition-colors mt-xs" type="submit">
                    Register
                </button>
</form>
</div>
<!-- Footer Link -->
<div class="mt-lg text-center">
<p class="font-body-md text-body-md text-on-surface-variant">
                Already have an account? 
                <a class="font-label-lg text-label-lg font-medium text-primary hover:text-primary-container transition-colors" href="/login">Login</a>
</p>
</div>
</main>
</body></html>
