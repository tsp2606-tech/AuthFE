<body class="bg-background text-on-surface font-body-md h-screen flex flex-col md:flex-row antialiased overflow-hidden">
<!-- Content Area -->
<main class="flex-1 overflow-y-auto bg-surface relative flex items-center justify-center p-4">
<!-- Background Pattern -->
<div class="absolute inset-0 opacity-[0.03] pointer-events-none" style="background-image: radial-gradient(circle at 2px 2px, #000 1px, transparent 0); background-size: 32px 32px;"></div>
<div class="w-full max-w-md relative z-10">
<!-- Header -->
<div class="mb-lg text-center">
<span class="material-symbols-outlined text-primary text-5xl mb-sm" style="font-variation-settings: 'FILL' 1;">lock_reset</span>
<h1 class="font-headline-lg text-headline-lg text-on-surface">Change Password</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant mt-2">Update your authentication credentials.</p>
</div>
<!-- Form Card -->
<div class="bg-surface-container-lowest rounded-[16px] shadow-sm p-lg border border-outline-variant/30">
<!-- Feedback: Success (Hidden by default) -->
<!-- <div class="mb-md bg-secondary-container/50 border border-secondary-container text-on-secondary-container rounded-lg p-sm flex items-start gap-sm">
                    <span class="material-symbols-outlined mt-0.5" style="font-variation-settings: 'FILL' 1;">check_circle</span>
                    <span class="font-body-md text-body-md">Password updated successfully.</span>
                </div> -->
<!-- Feedback: Error (Hidden by default) -->
<!-- <div class="mb-md bg-error-container/50 border border-error-container text-on-error-container rounded-lg p-sm flex items-start gap-sm">
                    <span class="material-symbols-outlined mt-0.5" style="font-variation-settings: 'FILL' 1;">error</span>
                    <span class="font-body-md text-body-md">Passwords do not match. Please try again.</span>
                </div> -->
<form class="space-y-md">
<!-- Old Password -->
<div>
<label class="block font-label-lg text-label-lg text-on-surface mb-xs" for="old-password">Old Password</label>
<div class="relative">
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg px-md py-sm font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors" id="old-password" placeholder="••••••••" type="password"/>
<button aria-label="Toggle password visibility" class="absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-on-surface transition-colors" type="button">
<span class="material-symbols-outlined text-[20px]">visibility_off</span>
</button>
</div>
</div>
<!-- Divider -->
<div class="h-px w-full bg-outline-variant/30 my-sm"></div>
<!-- New Password -->
<div>
<label class="block font-label-lg text-label-lg text-on-surface mb-xs" for="new-password">New Password</label>
<div class="relative">
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg px-md py-sm font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors" id="new-password" placeholder="••••••••" type="password"/>
<button aria-label="Toggle password visibility" class="absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-on-surface transition-colors" type="button">
<span class="material-symbols-outlined text-[20px]">visibility_off</span>
</button>
</div>
<p class="font-label-sm text-label-sm text-on-surface-variant mt-1.5 flex items-center gap-1">
<span class="material-symbols-outlined text-[14px]">info</span> Must be at least 12 characters long.
                        </p>
</div>
<!-- Confirm New Password -->
<div>
<label class="block font-label-lg text-label-lg text-on-surface mb-xs" for="confirm-password">Confirm New Password</label>
<div class="relative">
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg px-md py-sm font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors" id="confirm-password" placeholder="••••••••" type="password"/>
<button aria-label="Toggle password visibility" class="absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-on-surface transition-colors" type="button">
<span class="material-symbols-outlined text-[20px]">visibility_off</span>
</button>
</div>
</div>
<!-- Actions -->
<div class="pt-sm mt-md flex justify-end gap-sm border-t border-outline-variant/30">
<button class="px-md py-2 rounded-lg font-label-lg text-label-lg text-on-surface-variant hover:bg-surface-container transition-colors" type="button">
                            Cancel
                        </button>
<button class="px-md py-2 rounded-[8px] bg-[#3B82F6] hover:bg-primary-container text-white font-label-lg text-label-lg shadow-[0_1px_3px_rgba(0,0,0,0.1)] hover:shadow-[0_4px_6px_rgba(0,0,0,0.1)] transition-all flex items-center gap-2" type="submit">
<span>Confirm Changes</span>
<span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</div>
</form>
</div>
<div class="mt-lg text-center">
<a class="font-label-lg text-label-lg text-primary hover:underline flex items-center justify-center gap-1" href="#">
<span class="material-symbols-outlined text-[16px]">arrow_back</span> Return to Security Settings
                </a>
</div>
</div>
